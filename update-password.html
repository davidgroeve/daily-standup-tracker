<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - Daily Standup Tracker</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 2.5rem;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        input {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Update Password</h2>
        <p class="subtitle">Enter your new password below</p>

        <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password">
        </div>

        <button class="btn btn-primary btn-large" id="updateBtn">Update Password</button>
        <div id="message" style="margin-top: 1rem;"></div>
        <a href="login.html" class="btn btn-secondary btn-large"
            style="margin-top: 1rem; text-decoration: none; display: none;" id="loginLink">Back to Login</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Check if user came from a reset link (which logs them in)
            const { data: { session } } = await window.supabaseClient.auth.getSession();

            if (!session) {
                // If checking the hash for type=recovery...
                // Supabase handles the session exchange automatically when URL has tokens
                // But we can double check
                window.supabaseClient.auth.onAuthStateChange((event, session) => {
                    if (event === 'PASSWORD_RECOVERY') {
                        console.log('Recovery session active');
                    }
                });
            }
        });

        document.getElementById('updateBtn').addEventListener('click', async () => {
            const password = document.getElementById('newPassword').value;
            const btn = document.getElementById('updateBtn');
            const msg = document.getElementById('message');

            if (!password) {
                msg.textContent = 'Please enter a password';
                msg.style.color = '#ef4444';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const { error } = await window.auth.updatePassword(password);
                if (error) throw error;

                msg.textContent = 'Password updated successfully!';
                msg.style.color = '#48bb78';
                document.getElementById('loginLink').style.display = 'inline-block';
                btn.style.display = 'none';
            } catch (e) {
                msg.textContent = e.message;
                msg.style.color = '#ef4444';
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        });
    </script>
</body>

</html>
