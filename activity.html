<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Log - Daily Standup Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .activity-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: var(--spacing-xl);
        }

        .change-logs-section {
            margin-top: 0;
            min-height: 80vh;
        }

        .change-logs-list {
            max-height: none;
            overflow-y: visible;
        }
    </style>
</head>

<body>
    <div id="header-container"></div>

    <div class="activity-container">
        <section class="change-logs-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2>Recent Activity</h2>
                <button class="btn btn-primary" id="refreshLogsBtn">🔄 Refresh</button>
            </div>

            <div id="changeLogsList" class="change-logs-list">
                <p style="text-align: center; color: var(--text-muted);">Loading activity...</p>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await window.auth.protectRoute();
        });
    </script>
    <script src="js/header.js"></script>
    <script src="js/activity.js"></script>
</body>

</html>
