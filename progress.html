<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <title>Progress - Daily Standup Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/new_header.css">
    <style>
        .progress-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-xl);
        }

        .member-section {
            margin-bottom: 3rem;
        }

        .member-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--glass-border);
        }

        .member-color-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .member-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .daily-updates-list {
            display: grid;
            gap: 1.5rem;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }

        .update-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.25rem;
            backdrop-filter: blur(10px);
            transition: transform 0.2s, border-color 0.2s;
        }

        .update-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-primary);
        }

        .update-date {
            font-size: 0.85rem;
            color: var(--accent-primary);
            font-weight: 600;
            margin-bottom: 0.75rem;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .update-items {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .update-item {
            font-size: 0.9rem;
            line-height: 1.5;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            display: flex;
            gap: 8px;
        }

        .update-item::before {
            content: "•";
            color: var(--accent-primary);
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
            background: var(--glass-bg);
            border-radius: 12px;
            border: 1px dashed var(--glass-border);
        }

        @media (max-width: 768px) {
            .daily-updates-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div id="header-container"></div>

    <div class="progress-container">
        <div id="progressContent">
            <p style="text-align: center; color: var(--text-muted); padding: 4rem;">Loading progress data...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const session = await window.auth.protectRoute();
            if (session && session.user.email !== 'david.groeve@lovepomegranate.com') {
                window.location.href = 'index.html';
            }
        });
    </script>
    <script src="js/header.js"></script>
    <script src="js/progress.js"></script>
</body>

</html>
