<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <title>Roadmap Calendar - Rommaana</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --sidebar-width: 300px;
            --calendar-gap: 24px;
        }

        body {
            background: var(--bg-primary);
            overflow: hidden;
            /* Main scroll on content area */
        }

        .calendar-layout {
            display: flex;
            height: calc(100vh - 64px);
            overflow: hidden;
        }

        /* Task Picker Sidebar */
        .task-picker {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 100;
        }

        .picker-header {
            padding: var(--spacing-md);
            border-bottom: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.02);
        }

        .picker-header h3 {
            font-size: 0.9rem;
            margin-bottom: var(--spacing-sm);
            color: var(--accent-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box {
            position: relative;
            margin-bottom: var(--spacing-sm);
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.85rem;
            outline: none;
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.8rem;
            opacity: 0.5;
        }

        .picker-actions {
            display: flex;
            gap: 8px;
        }

        .btn-tiny {
            padding: 4px 8px;
            font-size: 0.7rem;
            flex: 1;
        }

        .task-list {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-sm);
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 2px;
        }

        .task-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .task-item.active {
            background: rgba(var(--accent-primary-rgb, 196, 30, 58), 0.1);
        }

        .task-item input {
            cursor: pointer;
        }

        .task-item .item-label {
            font-size: 0.8rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .item-type-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .dot-milestone {
            background: #6366f1;
        }

        .dot-task {
            background: #10b981;
        }

        .dot-subtask {
            background: #f59e0b;
        }

        /* Calendar Main Area */
        .calendar-main {
            flex: 1;
            overflow-y: auto;
            padding: var(--spacing-md);
            background: var(--bg-primary);
            scroll-behavior: smooth;
        }

        .calendar-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-sm);
        }

        .view-controls {
            display: flex;
            gap: 12px;
        }

        .calendar-grid-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 100%;
            height: calc(100vh - 120px);
        }

        .month-view {
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            height: 100%;
        }

        .month-title {
            background: #1a1f36;
            color: white;
            padding: 8px 16px;
            text-align: left;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: auto repeat(6, 1fr);
            flex: 1;
            border-collapse: collapse;
        }

        .day-header {
            padding: 4px;
            text-align: center;
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
        }

        .day-cell {
            padding: 4px;
            border-bottom: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            position: relative;
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .day-cell:nth-child(7n) {
            border-right: none;
        }

        .day-cell.weekend {
            background: rgba(255, 255, 255, 0.015);
        }

        .day-cell.other-month {
            opacity: 0.1;
            pointer-events: none;
        }

        .day-cell:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .day-number {
            font-size: 1.2rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 4px;
            line-height: 1;
            z-index: 1;
            display: block;
            text-align: right;
        }

        .day-cell.today .day-number {
            color: var(--accent-primary);
            opacity: 0.8;
        }

        .tasks-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            position: relative;
            z-index: 2;
            margin-top: 4px;
            flex: 1;
            overflow-y: auto;
        }

        .task-tag {
            font-size: 0.65rem;
            padding: 4px 6px;
            border-radius: 3px;
            color: white;
            white-space: normal;
            word-break: break-word;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            border-left: 2px solid rgba(0, 0, 0, 0.3);
            font-weight: 700;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            position: relative;
            line-height: 1.3;
        }

        .task-tag:hover {
            transform: scale(1.03) translateX(2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        /* Continuous bars for multi-day tasks */
        .task-tag.multi-day-start {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }

        .task-tag.multi-day-middle {
            border-radius: 0;
            border-left: none;
        }

        .task-tag.multi-day-end {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
            border-left: none;
        }

        .task-tag.milestone {
            background: linear-gradient(90deg, #6366f1, #4f46e5);
        }

        .task-tag.task {
            background: linear-gradient(90deg, #10b981, #059669);
        }

        .task-tag.subtask {
            background: linear-gradient(90deg, #f59e0b, #d97706);
        }

        .task-tag.subtask-1 {
            background: linear-gradient(90deg, #ec4899, #db2777);
        }

        /* Rose */
        .task-tag.subtask-2 {
            background: linear-gradient(90deg, #06b6d4, #0891b2);
        }

        /* Cyan */
        .task-tag.subtask-3 {
            background: linear-gradient(90deg, #84cc16, #65a30d);
        }

        /* Lime */

        .task-tag.completed {
            opacity: 0.7;
        }

        .task-tag.completed::after {
            content: '✓';
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.6rem;
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <div id="header-container"></div>

    <div class="calendar-layout">
        <!-- Sidebar: Task Picker -->
        <aside class="task-picker">
            <div class="picker-header">
                <h3><span>🚩</span> Select Items</h3>
                <div class="search-box">
                    <input type="text" id="taskSearch" placeholder="Search tasks (e.g. PT, VA)...">
                </div>
                <div class="picker-actions">
                    <button class="btn btn-secondary btn-tiny" onclick="selectAllTasks(true)">All</button>
                    <button class="btn btn-secondary btn-tiny" onclick="selectAllTasks(false)">None</button>
                    <button class="btn btn-secondary btn-tiny" onclick="toggleCompletedFilter()"
                        id="toggleCompletedBtn">Hide Done</button>
                </div>
            </div>
            <div class="task-list" id="sidebarTaskList">
                <div style="text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.8rem;">
                    Loading items...
                </div>
            </div>
        </aside>

        <!-- Main Content: Calendar -->
        <main class="calendar-main">
            <div class="calendar-nav-bar">
                <div class="view-controls">
                    <button class="btn btn-secondary" onclick="scrollToMonth('2025-11')">Dec 2025</button>
                    <button class="btn btn-secondary" onclick="scrollToMonth('2026-00')">Jan 2026</button>
                </div>
                <div>
                    <button class="btn btn-primary" onclick="window.location.href='roadmap.html'">
                        <span>📑</span> Back to Timeline View
                    </button>
                </div>
            </div>

            <div class="calendar-grid-wrapper" id="calendarWrapper">
                <!-- December 2025 -->
                <section class="month-view" id="month-2025-11">
                    <div class="month-title">
                        December 2025
                        <span style="font-size: 0.8rem; opacity: 0.5; font-weight: 400;">Project Execution</span>
                    </div>
                    <div class="calendar-grid">
                        <div class="day-header">SUN</div>
                        <div class="day-header">MON</div>
                        <div class="day-header">TUE</div>
                        <div class="day-header">WED</div>
                        <div class="day-header">THU</div>
                        <div class="day-header">FRI</div>
                        <div class="day-header">SAT</div>
                    </div>
                </section>

                <!-- January 2026 -->
                <section class="month-view" id="month-2026-00">
                    <div class="month-title">
                        January 2026
                        <span style="font-size: 0.8rem; opacity: 0.5; font-weight: 400;">Go-To-Market Phase</span>
                    </div>
                    <div class="calendar-grid">
                        <div class="day-header">SUN</div>
                        <div class="day-header">MON</div>
                        <div class="day-header">TUE</div>
                        <div class="day-header">WED</div>
                        <div class="day-header">THU</div>
                        <div class="day-header">FRI</div>
                        <div class="day-header">SAT</div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/header.js"></script>
    <script src="js/calendar.js"></script>
</body>

</html>
